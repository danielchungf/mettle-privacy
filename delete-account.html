<!DOCTYPE html>
<!--
  Moved to walkmettle.com on 2026-09-09 — one domain for everything Mettle
  points at, and the one the invite links already run on.

  This page stays because it cannot be taken down: the old address is compiled
  into every build already on a phone (the sign-in screen's legal line and the
  Settings constant), and an App Store or Play listing URL that 404s is a review
  problem as well as a dead end. GitHub Pages cannot serve a 301, so the
  redirect is a meta refresh with a canonical link for crawlers, a script for
  browsers that get there first, and a real link for anyone the other two fail.

  Nothing is maintained here. The policy lives in the walkmettle repo, written
  from docs/PRIVACY_POLICY.md in the app repo.
-->
